server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  client:
    # This IS the registry — it doesn't need to register with itself or
    # fetch a registry from anywhere else.
    register-with-eureka: false
    fetch-registry: false
  server:
    # Fine for local development with a single instance; self-preservation
    # exists to avoid dropping services during network partitions in a
    # real multi-node deployment, which doesn't apply here.
    enable-self-preservation: false
