server:
  port: 8081

spring:
  application:
    name: auth-service

  security:
    oauth2:
      client:
        registration:
          google:
            scope: openid,email,profile

  config:
    import: optional:classpath:application-local.properties

# Only auth-service ever calls JwtService.generateToken()/extractUsername()
# now — operation-service validates tokens through the Feign call instead
# of decoding them itself, so this secret doesn't need to be duplicated
# anywhere else.
app:
  jwt:
    secret: MyQuantityMeasurementApplicationSecretKey1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ
    expiration: 86400000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
